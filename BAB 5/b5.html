<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Flexbox Layout</title>
    <link rel="stylesheet" href="b5-style.css" />
  </head>
  <body>
    <!-- Navbar / Header -->
    <header class="header">
      <div class="logo">Logo Saya</div>
      <nav class="menu">
        <a href="#">Beranda</a>
        <a href="#">Tentang</a>
        <a href="#">Kontak</a>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Selamat Datang di Website Saya</h1>
    </section>

    <!-- Layout Sidebar + Konten Utama -->
    <div class="layout">
      <aside class="sidebar">
        <h3>Menu Sidebar</h3>
        <ul>
          <li>Dashboard</li>
          <li>Profil</li>
          <li>Pengaturan</li>
        </ul>
      </aside>

      <main class="konten">
        <h2>Konten Utama</h2>

        <!-- Kartu-kartu Flexbox -->
        <div class="kartu-wrapper">
          <div class="kartu">
            <h3>Kartu 1</h3>
            <p>Deskripsi singkat kartu 1.</p>
          </div>
          <div class="kartu">
            <h3>Kartu 2</h3>
            <p>Deskripsi singkat kartu 2.</p>
          </div>
          <div class="kartu">
            <h3>Kartu 3</h3>
            <p>Deskripsi singkat kartu 3.</p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
